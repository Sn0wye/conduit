name: release

# Pushing a tag like v0.1.0 builds every platform and publishes the release
# that install.sh downloads from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: make web
      - run: go vet ./... && go test ./...
      - run: VERSION="$GITHUB_REF_NAME" scripts/dist.sh
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/checksums.txt install.sh \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
