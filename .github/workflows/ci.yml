name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: make web
      - run: go vet ./... && go test ./...
      - run: for f in install.sh scripts/*.sh; do bash -n "$f"; done
      - run: PLATFORMS="linux/amd64 darwin/arm64" scripts/dist.sh
